[project]
name = "data-factory"
version = "0.1.0"
description = "Modular data processing and data-quality toolkit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "h5py>=3.16.0",
    "ipython>=9.16.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "tables>=3.11.1",
]

[project.scripts]
data-factory = "data_factory.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_factory"]
