[project]
name = "data-factory"
version = "0.1.0"
description = "Modular data processing and data-quality toolkit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "h5py>=3.16.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "tables>=3.11.1",
]

[project.scripts]
data-factory = "data_factory.cli.main:main"

[dependency-groups]
dev = [
    "ipython>=9.16.1",
    "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_factory"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplifications
    "RUF",
]
# Chinese log lines and error messages legitimately use full-width punctuation.
ignore = ["RUF001", "RUF002", "RUF003"]
